name: Cairo Prayer Times Bot

on:
  schedule:
    # يعمل كل 10 دقائق بتوقيت UTC (مناسب لتغطية أوقات الصلوات في القاهرة)
    - cron: "*/10 * * * *"
  workflow_dispatch: # يسمح لك بتشغيله يدوياً من الموبايل لتجربته فوراً

permissions:
  contents: read

jobs:
  run-prayer-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run prayer bot
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python prayer_bot.py
        
